[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "darkroom"
version = "0.1.0"
description = "Astrophotography editing from the command line, built on Siril, GraXpert and StarNet. Use it directly or through an agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "tifffile",
    "imagecodecs",          # StarNet2 writes LZW-compressed TIFF
    "pillow",
    "onnx",
    "onnxruntime==1.32.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
darkroom = "darkroom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["darkroom"]

# The Siril script templates live in siril/ at the repo root; ship them inside
# the wheel as darkroom/siril so non-editable installs find them too.
[tool.hatch.build.targets.wheel.force-include]
"siril" = "darkroom/siril"
# Same for the camera and look presets in presets/.
"presets" = "darkroom/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
