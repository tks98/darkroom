# Runs the unit tests on every push to main and every pull request. The tests use
# synthetic data and fakes: no Siril, GraXpert, StarNet, models, image data or
# network, so they run on a plain GitHub runner in under a minute.
#
# Actions are pinned by commit; the tag each commit belongs to is in the comment.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  wheel:
    # The pytest job imports darkroom from the checkout. This one builds the wheel and the
    # sdist, installs the wheel into a fresh venv, and checks that the installed package
    # finds the Siril templates and presets it ships, with the source tree out of the way.
    name: wheel and sdist (installed, not editable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel and the sdist
        run: |
          python -m pip install "build>=1.2"
          python -m build --outdir dist .
          ls -l dist
      - name: Check the sdist and the wheel contents
        run: |
          tar -tzf dist/darkroom-*.tar.gz > sdist.txt
          unzip -Z1 dist/darkroom-*.whl > wheel.txt
          for f in siril/stack.ssf presets/looks/galaxy.toml presets/cameras/seestar-s30-pro.toml; do
            grep -qx "darkroom-[^/]*/$f" sdist.txt || { echo "sdist lacks $f"; exit 1; }
            grep -qx "darkroom/$f" wheel.txt || { echo "wheel lacks darkroom/$f"; exit 1; }
          done
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/darkroom-*.whl "pytest>=8"
      - name: Smoke test outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/darkroom" --help
          "$RUNNER_TEMP/venv/bin/darkroom" --version
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"
      - name: Test the installed wheel
        run: |
          mv darkroom "$RUNNER_TEMP/darkroom-source"     # so that only the installed package can be imported
          "$RUNNER_TEMP/venv/bin/python" -c "import darkroom, sys; print(darkroom.__file__); sys.exit('site-packages' not in darkroom.__file__)"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider tests

  shell:
    name: shell scripts (bash -n, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: bash -n
        run: |
          for f in setup.sh docker/darkroom-docker; do bash -n "$f"; done
          sh -n docker/siril-cli
      - name: shellcheck
        # shellcheck is preinstalled on GitHub's Ubuntu runners
        run: |
          shellcheck --version
          shellcheck setup.sh docker/darkroom-docker docker/siril-cli
